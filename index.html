<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />

  <title>Liu Lab</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .header {
      position: relative;
      width: 100%;
    }

    .header img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .nav {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      z-index: 2;
    }

    .nav a {
      text-decoration: none;
      color: #fff;
      font-size: 36px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45), transparent);
      pointer-events: none;
    }
  </style>
</head>

  <header class="header">
    <img src="https://raw.githubusercontent.com/Liu-AI4MolDesign/Liu-AI4MolDesign.github.io/main/figures/githubhomepage.jpg" alt="Header Image" class="header-image" />

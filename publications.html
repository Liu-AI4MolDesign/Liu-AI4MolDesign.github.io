<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications - Liu Lab</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .header {
      position: relative;
      width: 100%;
    }

    .header img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .nav {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      z-index: 2;
    }

    .nav a {
      text-decoration: none;
      color: #fff;
      font-size: 36px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .nav a:hover {
      text-decoration: underline;
      color: #f3c969;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45), transparent);
      pointer-events: none;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    .year {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    .pub-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .pub-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 14px;
    }

    .pub-main {
      flex: 1;
      min-width: 0;
      line-height: 1.8;
      font-size: 16px;
    }

    .pub-links {
      flex-shrink: 0;
      display: flex;
      gap: 14px;
      white-space: nowrap;
      font-size: 15px;
    }

    .pub-links a {
      color: #1f5faa;
      text-decoration: none;
    }

    .pub-links a:hover {
      text-decoration: underline;
    }

    .me {
      font-weight: 700;
    }

    .sep {
      margin: 0 4px;
    }

    @media (max-width: 700px) {
      .pub-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .pub-links {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="research.html">RESEARCH</a>
      <a href="publications.html">PUBLICATIONS</a>
      <a href="people.html">PEOPLE</a>
      <a href="contact.html">CONTACT</a>
      <a href="resources.html">RESOURCES</a>
    </nav>
  </header>

  <main class="content">
    <div class="year">2026</div>

    <div class="pub-list">
      <div class="pub-item">
        <div class="pub-main">
          <span class="me">Your Name</span>, Author B#, Author C*
          <span class="sep">.</span>
          <span>Paper Title One</span>
          <span class="sep">.</span>
          <span>Journal Name, 2026</span>
        </div>
        <div class="pub-links">
          <a href="#">PDF</a>
          <a href="#">DOI</a>
          <a href="#">Code</a>
        </div>
      </div>

      <div class="pub-item">
        <div class="pub-main">
          Author A#, <span class="me">Your Name</span>, Author C*
          <span class="sep">.</span>
          <span>Paper Title Two</span>
          <span class="sep">.</span>
          <span>Conference Name, 2026</span>
        </div>
        <div class="pub-links">
          <a href="#">PDF</a>
          <a href="#">DOI</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>

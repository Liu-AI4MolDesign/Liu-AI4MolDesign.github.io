<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications - My Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.6;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 18px 20px 10px;
      border-bottom: 1px solid #e6e6e6;
    }

    .nav a {
      text-decoration: none;
      color: #222;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: #f3c969;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 20px 60px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 34px;
    }

    .year-group {
      margin-bottom: 32px;
    }

    .year {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    .pub-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .pub-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .pub-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .pub-authors,
    .pub-journal {
      margin: 0 0 4px;
      color: #444;
      font-size: 15px;
    }

    .pub-links {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pub-links a {
      color: #1f5faa;
      text-decoration: none;
      font-size: 14px;
    }

    .pub-links a:hover {
      text-decoration: underline;
    }

    .me {
      font-weight: 700;
      color: #000;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">HOME</a>
    <a href="research.html">RESEARCH</a>
    <a href="publications.html">PUBLICATIONS</a>
    <a href="people.html">PEOPLE</a>
    <a href="contact.html">CONTACT</a>
    <a href="resources.html">RESOURCES</a>
  </nav>

  <main class="content">
    <h1>Publications</h1>
    <p class="note">
      <span>* Corresponding author</span>
      <span># Co-first author</span>
    </p>
    
    <section class="year-group">
      <div class="year">2026</div>
      <ul class="pub-list">
        <li class="pub-item">
          <span class="pub-title">Paper Title One</span>
          <span class="pub-authors"><strong class="me">Your Name</strong>, Author B#, Author C*, Author D</span>
          <span class="pub-journal">Journal Name, 2026</span>
          <div class="pub-links">
            <a href="#">PDF</a>
            <a href="#">DOI</a>
            <a href="#">Code</a>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
